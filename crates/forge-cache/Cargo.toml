[package]
name = "forge-cache"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Application and HTTP response cache for Forge framework"

[dependencies]
axum = "0.8"
bytes = "1.0"
forge-config = { path = "../forge-config" }
http = "1.0"
moka = { version = "0.12", features = ["future"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
