[package]
name = "forge-live"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Live Query: real-time broadcast and channel subscription for Forge"

[features]
default = []
redis = ["dep:redis", "dep:futures-util", "tracing"]

[dependencies]
async-trait = "0.1"
forge-core = { path = "../forge-core" }
redis = { version = "0.27", optional = true, features = ["aio", "tokio-comp"] }
futures-util = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "net", "macros", "rt-multi-thread", "time"] }
tracing = { version = "0.1", optional = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
