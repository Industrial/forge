[package]
name = "forge-cron"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Cron-style schedule types for Forge framework"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
forge-db = { path = "../forge-db" }
tokio = { version = "1", features = ["time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
