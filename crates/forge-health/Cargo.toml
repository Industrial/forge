[package]
name = "forge-health"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Health check endpoints for Forge framework"

[dependencies]
axum = "0.8"
forge-db = { path = "../forge-db" }
sea-orm = { version = "1.1", default-features = false, features = [
  "sqlx-sqlite",
  "with-uuid",
  "with-chrono",
] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
forge-config = { path = "../forge-config" }
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
