[package]
name = "forge-jobs"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Background jobs (Apalis) for Forge framework"

[dependencies]
apalis = "1.0.0-rc.9"
apalis-codec = "0.1.0-rc.9"
apalis-sqlite = { version = "1.0.0-rc.8", features = [
  "tokio-comp",
  "migrate",
  "json",
] }
forge-db = { path = "../forge-db" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
sea-orm = { version = "1.1", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
  "with-uuid",
  "with-chrono",
] }
sea-orm-tracing = "0.2"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
