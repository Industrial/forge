[package]
name = "forge-auth"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Authentication (password hashing, API token) for Forge framework"

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
axum-login = "0.17"
forge-core = { path = "../forge-core" }
forge-db = { path = "../forge-db" }
futures = "0.3"
hex = "0.4"
sea-orm = { version = "1.1", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
subtle = "2.5"
thiserror = "2.0"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
