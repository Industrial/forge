[package]
name = "forge"
version = "0.1.0"
edition = "2021"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
homepage = "https://github.com/Industrial/forge"
documentation = "https://docs.rs/forge"
description = "A full-stack web framework for Rust — inspired by Django and Rails"
keywords = ["web", "framework", "http", "async", "full-stack"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.10"

[lints.rust]
# Shared lint configuration
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
