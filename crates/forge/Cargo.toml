[package]
name = "forge"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
homepage = "https://github.com/Industrial/forge"
documentation = "https://docs.rs/forge"
description = "A full-stack web framework for Rust — inspired by Django and Rails"
keywords = ["web", "framework", "http", "async", "full-stack"]
categories = ["web-programming::http-server", "asynchronous"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
async-trait = "0.1"
sea-orm = { version = "1.1", features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
] }
sea-orm-migration = { version = "1.1" }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
axum-login = "0.17"
argon2 = "0.5"
sha2 = "0.10"
subtle = "2.5"
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
forge-macros = { path = "../forge-macros" }
forge-authz = { path = "../forge-authz" }
tower_governor = "0.8"
governor = "0.10"
validator = { version = "0.20", features = ["derive"] }
axum-valid = { version = "0.24", features = ["422", "into_json"] }
apalis = "1.0.0-rc.4"
apalis-sqlite = { version = "1.0.0-rc.4", features = [
  "tokio-comp",
  "migrate",
  "json",
] }
moka = { version = "0.12", features = ["future"] }
bytes = "1.0"
http = "1.0"
# Health observability (017): distributed tracing, W3C trace context (0.31 to match axum-tracing-opentelemetry)
axum-tracing-opentelemetry = "0.33"
tracing-opentelemetry-instrumentation-sdk = "0.32"
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
sea-orm-tracing = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
tempfile = "3.10"

[lints.rust]
# Shared lint configuration
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
