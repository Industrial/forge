[package]
name = "forge-audit"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Structured audit logging for Forge framework"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
forge-auth = { path = "../forge-auth" }
sea-orm = { version = "1.1", default-features = false, features = [
  "sqlx-sqlite",
  "with-uuid",
  "with-chrono",
] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage)',
  'cfg(feature, values("mock"))',
] }
