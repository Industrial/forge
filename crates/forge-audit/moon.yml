language: rust
type: library
tasks:
  build:
    command: cargo
    args:
      - build
      - -p
      - forge-audit
    options:
      runFromWorkspaceRoot: true
    inputs:
      - Cargo.toml
      - Cargo.lock
      - '**/*.rs'
    deps:
      - forge-audit:lint
  check:
    command: cargo
    args:
      - check
      - -p
      - forge-audit
      - --all-features
    options:
      runFromWorkspaceRoot: true
    inputs:
      - Cargo.toml
      - Cargo.lock
      - '**/*.rs'
  test:
    command: cargo
    args:
      - nextest
      - run
      - -p
      - forge-audit
      - --all-features
    options:
      runFromWorkspaceRoot: true
    inputs:
      - Cargo.toml
      - Cargo.lock
      - '**/*.rs'
      - '**/*.toml'
    deps:
      - forge-audit:build
  lint:
    command: cargo
    args:
      - clippy
      - -p
      - forge-audit
      - --all-targets
      - --all-features
      - --
      - -D
      - warnings
    options:
      runFromWorkspaceRoot: true
    inputs:
      - Cargo.toml
      - Cargo.lock
      - '**/*.rs'
    deps:
      - forge:format
      - forge-audit:check
