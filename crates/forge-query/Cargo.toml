[package]
name = "forge-query"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Unified query specification (filter, sort, pagination) for Forge framework"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
