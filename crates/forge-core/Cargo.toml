[package]
name = "forge-core"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Core error and validation types for Forge framework"
keywords = ["forge", "error", "validation"]

[dependencies]
validator = { version = "0.20", features = ["derive"] }
axum-valid = { version = "0.24", features = ["422", "into_json"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
