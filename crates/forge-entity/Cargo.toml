[package]
name = "forge-entity"
version = "0.1.0"
edition = "2024"
authors = ["Tom Wieland <tom.wieland@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Industrial/forge"
description = "Generic REST model trait and registry pattern for Forge framework"

[dependencies]
async-trait = "0.1"
forge-db = { path = "../forge-db" }
forge-query = { path = "../forge-query" }
sea-orm = { version = "1.1", default-features = false, features = [
  "sqlx-sqlite",
  "with-uuid",
  "with-chrono",
] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
