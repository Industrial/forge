[package]
name = "migrations"
version = "0.1.0"
edition = "2024"

[dependencies]
app = { path = "../app" }
db = { path = "../db" }
forge-auth = { path = "../../../../../forge-auth" }
forge-db = { path = "../../../../../forge-db" }
sea-orm = { version = "1.1", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
  "with-uuid",
  "with-chrono",
] }
sea-orm-migration = "1.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tracing = "0.1"
