[package]
name = "app"
version = "0.1.0"
edition = "2024"

[features]
# Enable when running integration tests (e.g. cargo test -p app --features test-utils).
# Exposes test_client() and HTTP path; reqwest is optional. In-process path uses dev-deps (migrations).
test-utils = ["reqwest"]

[dependencies]
accept-language = "3.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-login = "0.17"
chrono = { version = "0.4", features = ["serde"] }
db = { path = "../db" }
fluent = "0.16"
fluent-templates = "0.13"
# In-repo paths for `forge dev` from templates/default; replaced with {{FORGE_PATH}} by `forge new`
forge-app = { path = "../../../../../forge-app" }
forge-audit = { path = "../../../../../forge-audit" }
forge-auth = { path = "../../../../../forge-auth" }
forge-cache = { path = "../../../../../forge-cache" }
forge-config = { path = "../../../../../forge-config" }
forge-core = { path = "../../../../../forge-core" }
forge-cron = { path = "../../../../../forge-cron" }
forge-db = { path = "../../../../../forge-db" }
forge-live = { path = "../../../../../forge-live" }
forge-observability = { path = "../../../../../forge-observability" }
futures-util = "0.3"
sea-orm = { version = "1.1", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
  "with-uuid",
  "with-chrono",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
unic-langid = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
validator = { version = "0.20", features = ["derive"] }
tempfile = "3.14"
tower = "0.5"

# Only when feature "test-utils" is enabled (HTTP path in test_client()).
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }

[dev-dependencies]
migrations = { path = "../migrations" }
sea-orm-migration = "1.1"

