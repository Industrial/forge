[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
# In-repo path for `forge dev` from templates/default; replaced by `forge new`
forge = { path = "../../../../../forge" }
sea-orm = { version = "1.1", features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
] }
sea-orm-migration = "1.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tracing = "0.1"
