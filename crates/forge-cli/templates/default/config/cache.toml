enabled = true

[application]
enabled = true
max_capacity = 10_000
default_ttl_secs = 300

[http_response]
enabled = true
default_ttl_secs = 60
# Exclude /api so auth- and scope-dependent responses are never cached (avoids serving one user's response to another).
no_cache_paths = [
  "/",
  "/login",
  "/register",
  "/dashboard",
  "/ws-demo",
  "/api",
  "/healthz",
  "/livez",
  "/readyz",
]
