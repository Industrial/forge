language: rust
type: library
tasks:
  build:
    command: cargo
    args:
    - build
    - -p
    - forge-security
    options:
      runFromWorkspaceRoot: true
    inputs:
    - Cargo.toml
    - Cargo.lock
    - '**/*.rs'
    deps:
    - forge-security:lint
  check:
    command: cargo
    args:
    - check
    - -p
    - forge-security
    - --all-features
    options:
      runFromWorkspaceRoot: true
    inputs:
    - Cargo.toml
    - Cargo.lock
    - '**/*.rs'
  test:
    command: cargo
    args:
    - nextest
    - run
    - -p
    - forge-security
    - --all-features
    options:
      runFromWorkspaceRoot: true
    inputs:
    - Cargo.toml
    - Cargo.lock
    - '**/*.rs'
    - '**/*.toml'
    deps:
    - forge-security:build
  lint:
    command: cargo
    args:
    - clippy
    - -p
    - forge-security
    - --all-targets
    - --all-features
    - --
    - -D
    - warnings
    options:
      runFromWorkspaceRoot: true
    inputs:
    - Cargo.toml
    - Cargo.lock
    - '**/*.rs'
    deps:
    - forge-security:check
