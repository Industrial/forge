name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
env:
  CARGO_TERM_COLOR: always
  # Build optimization: sccache for compilation caching
  RUSTC_WRAPPER: sccache
permissions:
  contents: read
jobs:
  pre-push:
    name: Pre-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      # Setup sccache for compilation caching
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4
        with:
          version: "latest"
        env:
          SCCACHE_DIR: ${{ runner.tool_cache }}/sccache
      # Install mold linker for faster linking on Linux
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Install moon
        run: |
          curl -fsSL https://moonrepo.dev/install/moon.sh | bash
          export PATH="$HOME/.moon/bin:$PATH"
          moon --version
      - name: Run moon tasks (format, check, lint, build, test, audit, check-docs)
        env:
          MOON_TOOLCHAIN_FORCE_GLOBALS: rust
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          devenv shell -- moon run :format :check :lint :build :test :audit :check-docs
      - name: Run integration tests
        env:
          MOON_TOOLCHAIN_FORCE_GLOBALS: rust
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          devenv shell -- moon run :test-integration
      - name: Run e2e tests
        env:
          MOON_TOOLCHAIN_FORCE_GLOBALS: rust
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          devenv shell -- moon run :test-e2e
      # Show sccache statistics
      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats
