[package]
name = "forge-e2e-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
forge = { path = "../../crates/forge" }
tower = { version = "0.4", features = ["util"] }
http = "1.0"
axum = "0.7"

[[test]]
name = "001_cli"
path = "001_cli.rs"

[[test]]
name = "002_config"
path = "002_config.rs"

[[test]]
name = "003_database"
path = "003_database.rs"

[[test]]
name = "004_migrations"
path = "004_migrations.rs"