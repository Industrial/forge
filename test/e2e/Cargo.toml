[package]
name = "forge-e2e-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
forge = { path = "../../crates/forge" }
tower = { version = "0.4", features = ["util"] }
http = "1.0"
axum = "0.8"
axum-login = "0.17"
serde = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
dashmap = "6"

[[test]]
name = "001_cli"
path = "001_cli.rs"

[[test]]
name = "002_config"
path = "002_config.rs"

[[test]]
name = "003_database"
path = "003_database.rs"

[[test]]
name = "004_migrations"
path = "004_migrations.rs"

[[test]]
name = "005_auth"
path = "005_auth.rs"

[[test]]
name = "006_authz"
path = "006_authz.rs"
